
<div class="container">
<div class="card"  *ngFor="let post of posts">
  <div class="card-header">Post attivi</div>
  <div class="card-body">
    <figure>
      <blockquote class="blockquote">
        <p>{{post.body}}</p>
      </blockquote>
      <p>{{post.title}}</p>
    </figure>
  </div>
</div>
</div>
